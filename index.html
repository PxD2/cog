<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COG — Library of Meanings</title>
<style>
:root{--bg:#0c0e12;--panel:#161a22;--ink:#e6e8ec;--muted:#8b929a;--accent:#6ea8fe;--line:#252a33;--ok:#7dcea0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
header{padding:1.1rem 1.4rem;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
header h1{font-size:1.15rem;font-weight:600;letter-spacing:.03em}
header .tag{font-size:.72rem;color:var(--muted);margin-top:.15rem}
nav{display:flex;gap:.4rem;flex-wrap:wrap}
nav button{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:.35rem .7rem;border-radius:6px;cursor:pointer;font-size:.82rem}
nav button.active,nav button:hover{border-color:var(--accent);color:var(--accent)}
main{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 64px)}
@media(max-width:700px){main{grid-template-columns:1fr}}
aside{border-right:1px solid var(--line);padding:.9rem;background:var(--panel)}
aside h2{font-size:.65rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 .6rem}
.room{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--ink);padding:.5rem .55rem;border-radius:6px;cursor:pointer;font-size:.88rem;margin-bottom:.2rem}
.room:hover,.room.active{background:#1e232c;color:var(--accent)}
.section{padding:1.3rem;overflow:auto}
.hero{margin-bottom:1.3rem}
.hero h2{font-size:1.35rem;margin-bottom:.3rem}
.hero p{color:var(--muted);max-width:40rem;font-size:.92rem}
.grid{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.9rem;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card .id{font-family:ui-monospace,monospace;font-size:.72rem;color:var(--accent);margin-bottom:.3rem}
.card h3{font-size:.95rem;margin-bottom:.3rem}
.card .keys{font-size:.78rem;color:var(--muted)}
.detail{display:none;margin-top:1.3rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.1rem}
.detail.open{display:block}
.detail h3{margin-bottom:.4rem}
.addr{font-family:ui-monospace,monospace;background:#0f1218;padding:.3rem .55rem;border-radius:4px;font-size:.82rem;display:inline-block;margin-bottom:.9rem;color:var(--ok)}
.variants{list-style:none}
.variants li{padding:.4rem 0;border-bottom:1px solid var(--line);display:flex;gap:.7rem;align-items:baseline}
.variants li:last-child{border-bottom:none}
.variants .idx{font-family:ui-monospace,monospace;font-size:.72rem;color:var(--muted);min-width:1.7rem}
.fast{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.8rem}
.fast a{font-size:.76rem;color:var(--accent);text-decoration:none;border:1px solid var(--line);padding:.22rem .5rem;border-radius:4px}
.fast a:hover{border-color:var(--accent)}
footer{padding:.9rem 1.4rem;border-top:1px solid var(--line);font-size:.72rem;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div>
    <h1>COG</h1>
    <div class="tag">Library of meanings · (meaning-id, variant-index)</div>
  </div>
  <nav>
    <button data-go="entrance" class="active">Entrance</button>
    <button data-go="english">English</button>
    <button data-go="physics">Physics</button>
    <button data-go="philosophy">Philosophy</button>
  </nav>
</header>
<main>
  <aside>
    <h2>Rooms</h2>
    <button class="room active" data-go="entrance">Entrance</button>
    <button class="room" data-go="english">English</button>
    <button class="room" data-go="physics">Physics</button>
    <button class="room" data-go="philosophy">Philosophy</button>
    <h2 style="margin-top:1.3rem">Fast Transport</h2>
    <div class="fast" id="fast-links"></div>
  </aside>
  <div class="section" id="view"></div>
</main>
<footer>
  Permanent · append-only · GitHub only · two numbers address every sentence
</footer>
<script>
const books = {
  english: { title: "English", blurb: "Inquiry into situation, status, activity. One meaning, many exact forms.", file: "books/cog-english-v0.json" },
  physics: { title: "Physics", blurb: "Core physical meanings. Force, energy, gravity, relativity, quantum.", file: "books/cog-physics-v0.json" },
  philosophy: { title: "Philosophy", blurb: "Foundational meanings. Existence, knowledge, ethics, free will, truth.", file: "books/cog-philosophy-v0.json" }
};
const cache = {};
async function load(name) {
  if (cache[name]) return cache[name];
  const res = await fetch(books[name].file);
  const data = await res.json();
  cache[name] = data;
  return data;
}
function entrance() {
  document.getElementById("view").innerHTML = `
    <div class="hero">
      <h2>Library of Meanings</h2>
      <p>Every distinct meaning receives one permanent number. Every exact surface sentence under that meaning receives a second number. The pair is the complete address. Walk the rooms. Click any card. Use Fast Transport to jump.</p>
    </div>
    <div class="grid">
      <div class="card" data-go="english"><div class="id">Hall</div><h3>English</h3><div class="keys">inquiry · status · sitrep</div></div>
      <div class="card" data-go="physics"><div class="id">Wing</div><h3>Physics</h3><div class="keys">force · energy · gravity · relativity · quantum</div></div>
      <div class="card" data-go="philosophy"><div class="id">Wing</div><h3>Philosophy</h3><div class="keys">existence · knowledge · ethics · free will · truth</div></div>
    </div>`;
  bindCards();
}
async function showRoom(name) {
  const meta = books[name];
  const data = await load(name);
  const cards = data.s.map(row => {
    const [id, keys, , phrases] = row;
    return `<div class="card" data-id="${id}" data-room="${name}">
      <div class="id">${id}</div>
      <h3>${keys[0].replace(/_/g," ")}</h3>
      <div class="keys">${keys.join(" · ")} · ${phrases.length} variants</div>
    </div>`;
  }).join("");
  document.getElementById("view").innerHTML = `
    <div class="hero"><h2>${meta.title}</h2><p>${meta.blurb}</p></div>
    <div class="grid">${cards}</div>
    <div class="detail" id="detail"></div>`;
  document.querySelectorAll(".card[data-id]").forEach(c => {
    c.onclick = () => expand(name, +c.dataset.id);
  });
  const fl = document.getElementById("fast-links");
  fl.innerHTML = data.s.map(r => `<a href="#" data-jump="${name}:${r[0]}">${r[0]}</a>`).join("");
  fl.querySelectorAll("a").forEach(a => {
    a.onclick = e => { e.preventDefault(); const [rm,id] = a.dataset.jump.split(":"); go(rm); setTimeout(()=>expand(rm,+id),40); };
  });
}
function expand(room, id) {
  const data = cache[room];
  const row = data.s.find(r => r[0] === id);
  if (!row) return;
  const [, keys, , phrases] = row;
  const list = phrases.map((p,i) => `<li><span class="idx">${i}</span><span>${p}</span></li>`).join("");
  const d = document.getElementById("detail");
  d.className = "detail open";
  d.innerHTML = `<h3>${keys[0].replace(/_/g," ")}</h3><div class="addr">(${id}, N)</div><ul class="variants">${list}</ul>`;
  d.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function go(name) {
  document.querySelectorAll("nav button, .room").forEach(b => b.classList.toggle("active", b.dataset.go === name));
  if (name === "entrance") entrance();
  else showRoom(name);
}
function bindCards() {
  document.querySelectorAll(".card[data-go]").forEach(c => { c.onclick = () => go(c.dataset.go); });
}
document.querySelectorAll("nav button, .room").forEach(b => { b.onclick = () => go(b.dataset.go); });
entrance();
</script>
</body>
</html>
